server {
    listen 80;
    server_name localhost;
    
    # Встроенный DNS Docker'а
    resolver 127.0.0.11 valid=10s;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Прокси для Hub
    location /hub/ {
        set $upstream_hub http://hub-0001:5000;
        rewrite ^/hub/(.*)$ /$1 break;
        proxy_pass $upstream_hub;
    }

    # Прокси для Node A
    location /node-a/ {
        set $upstream_node_a http://node-a:8080;
        rewrite ^/node-a/(.*)$ /$1 break;
        proxy_pass $upstream_node_a;
    }

    # Прокси для Node B
    location /node-b/ {
        set $upstream_node_b http://node-b:8081;
        rewrite ^/node-b/(.*)$ /$1 break;
        proxy_pass $upstream_node_b;
    }
}