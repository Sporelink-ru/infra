services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sporelink
      POSTGRES_PASSWORD: sporelink_secret
      POSTGRES_DB: sporelink_db
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sporelink -d sporelink_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sporelink

  hub-0001:
    build:
      context: ..
      dockerfile: infra/hub.Dockerfile
    ports:
      - "5000:5000"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - hub-textures:/app/data
    environment:
      - SPORELINK_SERVER_ID=hub-0001
      - SPORELINK_SERVER_NAME=Hub One
      - SPORELINK_BASE_URL=http://localhost:5000
      - SPORELINK_PEERS=http://hub-0002:5001
      - DB_CONNECTION_STRING=Host=postgres;Database=sporelink_db;Username=sporelink;Password=sporelink_secret
    networks:
      - sporelink

  hub-0002:
    build:
      context: ..
      dockerfile: infra/hub.Dockerfile
    ports:
      - "5001:5000"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - hub-textures:/app/data
    environment:
      - SPORELINK_SERVER_ID=hub-0002
      - SPORELINK_SERVER_NAME=Hub Two
      - SPORELINK_BASE_URL=http://localhost:5001
      - SPORELINK_PEERS=http://hub-0001:5000
      - DB_CONNECTION_STRING=Host=postgres;Database=sporelink_db;Username=sporelink;Password=sporelink_secret
    networks:
      - sporelink

  node-a:
    build:
      context: ..
      dockerfile: infra/node.Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - node-a-data:/data
    command: ["8080", "/data", "node-a", "http://hub-0001:5000"]
    depends_on:
      - hub-0001
    networks:
      - sporelink

  node-b:
    build:
      context: ..
      dockerfile: infra/node.Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - node-b-data:/data
    command: ["8081", "/data", "node-b", "http://hub-0001:5000"]
    depends_on:
      - hub-0001
    networks:
      - sporelink

  panel:
    build:
      context: ..
      dockerfile: infra/panel.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - hub-0001
      - node-a
      - node-b
    networks:
      - sporelink

volumes:
  pg-data:
  hub-textures:
  node-a-data:
  node-b-data:

networks:
  sporelink:
    driver: bridge